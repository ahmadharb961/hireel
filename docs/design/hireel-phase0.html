<title>Hireel Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one 430px-wide phone column, centered on larger screens. Each screen = header + scrolling main + bottom nav. The feed is full-bleed with floating header and translucent nav. */
:root{
  --g:#195C48;--g2:#235443;--mint:#B3E2CD;--bg:#FAF9F6;--card:#FFFFFF;--tx:#182722;--tx2:#69766F;--bd:#E4EAE5;
  --brand:#195C48;--soft:#EAF5EF;--bad:#B42318;--badbg:#FDECEA;--warn:#8A4B00;--warnbg:#FFF3E0;--on:#FFFFFF;--media:#0f1a16;
  --font:"Inter","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a16;--card:#182722;--tx:#f1f5f2;--tx2:#9fb0a8;--bd:#2a3b34;--brand:#B3E2CD;--soft:#1d3a30;--bad:#F97066;--badbg:#3b1a17;--warn:#F5C27A;--warnbg:#3a2a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#182722;--tx:#f1f5f2;--tx2:#9fb0a8;--bd:#2a3b34;--brand:#B3E2CD;--soft:#1d3a30;--bad:#F97066;--badbg:#3b1a17;--warn:#F5C27A;--warnbg:#3a2a12;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bg)}
#view{height:100%}
.scr{position:relative;height:100%;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--bg);min-height:58px}
.hd .l{display:flex;align-items:center;gap:8px;min-width:0}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;color:var(--brand);border:0;background:none;cursor:pointer;padding:0}
.badge{font-size:11px;background:var(--mint);color:var(--g);padding:5px 9px;border-radius:99px;font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.ib{border:0;background:none;color:var(--brand);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.main{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px}
h1{font-size:30px;line-height:1.12;letter-spacing:-.5px;text-wrap:balance}
h2{font-size:20px;line-height:1.25;text-wrap:balance}
h3{font-size:15px;line-height:1.3}
p,li{color:var(--tx2);font-size:14px;line-height:1.5}
ul{padding-left:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.note{font-size:12px;color:var(--tx2);line-height:1.45}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .3s}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 4px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--tx2)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:54px;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.g{background:var(--bd);color:var(--tx)}
.btn.m{background:var(--mint);color:var(--g)}
.btn.o{background:transparent;color:var(--brand);border:1.5px solid var(--bd)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.w{width:100%}
.btn.sm{min-height:44px;padding:10px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw>div,.sw>p{min-width:0}
.tog{position:relative;width:50px;height:30px;border-radius:99px;background:var(--bd);border:0;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--g)}.tog.on::after{left:23px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--tx)}
input.i,select.i,textarea.i{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;min-height:48px}
textarea.i{min-height:90px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tx);line-height:1.45;margin-top:12px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--g);margin-top:1px}
.err{color:var(--bad);font-size:13px;margin-top:8px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--brand);white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.mute{background:var(--bd);color:var(--tx2)}
.sk{display:inline-block;background:var(--soft);color:var(--brand);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:500}
.seg{display:flex;gap:8px}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px;min-height:56px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.seg small{font-weight:500;font-size:12px;opacity:.85}
.demo{border:1.5px dashed var(--bd);border-radius:16px;padding:12px}
.demo>b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.chipbtn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:99px;font-size:14px;cursor:pointer;min-height:40px}
.chipbtn.on{background:var(--g);color:#fff;border-color:var(--g)}
.list-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:16px;background:var(--card);cursor:pointer;text-align:left;width:100%;color:var(--tx)}
.thumb{width:54px;height:72px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-weight:700;font-size:18px}
.list-row .t{min-width:0;flex:1}
.list-row .t b{display:block;font-size:15px}
.list-row .t span{display:block;font-size:13px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--tx2);font-size:14px}

/* candidate nav + video boxes (from approved candidate prototype) */
nav.bn{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav.bn button{flex:1;border:0;background:none;color:var(--tx2);font-size:13px;padding:8px 0;min-height:68px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
nav.bn button i{font-style:normal;display:flex;color:var(--brand)}
nav.bn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bn button.on{color:var(--brand);font-weight:700}
.vid{position:relative;aspect-ratio:9/16;max-height:52vh;max-width:100%;margin:0 auto;border-radius:20px;background:var(--media);color:#9fb0a8;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;font-size:14px}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid.lb video.bgv{filter:blur(22px) brightness(.6);transform:scale(1.25);object-fit:cover}
.vid.lb video.fgv{object-fit:contain}
.vid .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff}
.vid .ph b{font-size:64px;opacity:.3}
.vid .st{position:absolute;top:10px;left:10px;z-index:2}
.q{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;color:var(--tx)}
.link{display:flex;gap:6px;margin-top:10px}
.link input{flex:1;min-width:0;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:13px}
.pp{background:var(--g);color:#fff;border-radius:20px;padding:20px}
.pp h2{color:#fff}
.pp .vp{position:relative;aspect-ratio:9/12;max-width:100%;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:13px;overflow:hidden}
.pp .vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pp span.t{display:inline-block;background:rgba(179,226,205,.22);border:1px solid rgba(179,226,205,.5);padding:3px 10px;border-radius:99px;font-size:12px;margin:6px 6px 0 0}
.lgp{border:1px solid rgba(179,226,205,.6);background:transparent;color:#fff;border-radius:99px;padding:8px 14px;font-size:13px;min-height:40px;cursor:pointer}
.lgp.on{background:var(--mint);color:var(--g)}

/* employer feed (from approved feed prototype) */
.fs{background:var(--media)}
.fs .fh{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);padding:14px 16px 24px}
.fs .logo{color:#fff}
.fs .badge{background:rgba(255,255,255,.2);color:#fff}
#fbtn{border:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;padding:8px 16px;border-radius:99px;font-size:15px;font-weight:600;cursor:pointer;min-height:42px}
.chips{position:absolute;top:64px;left:0;right:0;z-index:6;display:none;margin:0 12px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);flex-direction:column;gap:12px;max-height:70%;overflow:auto}
.chips.show{display:flex}
.chips h4{font-size:13px;color:var(--tx2);font-weight:600;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:10px 16px;border-radius:99px;font-size:15px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.item{height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.fcard{position:relative;height:100%;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:88px;font-weight:700;opacity:.25}
.blurbg{position:absolute;inset:-40px;filter:blur(28px) brightness(.7)}
.landf{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;color:rgba(255,255,255,.3);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,0) 55%)}
.top{position:absolute;top:66px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 10px;border-radius:99px;font-size:12px;color:#fff}
.mute{border:0;cursor:pointer;min-height:36px}
.pz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.pz span{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:28px}
.item.paused .pz{display:flex}
.info{position:relative;padding:16px 16px 88px}
.info h2{font-size:22px;color:#fff}
.role{margin-top:2px;opacity:.92;font-size:15px}
.meta{margin-top:6px;font-size:13px;opacity:.85}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.skills span{background:rgba(179,226,205,.22);border:1px solid rgba(179,226,205,.5);padding:4px 10px;border-radius:99px;font-size:12px}
.avail{display:inline-block;background:var(--mint);color:var(--g);font-weight:600;font-size:12px;padding:4px 10px;border-radius:99px;margin-bottom:6px}
.langs{display:flex;gap:6px;margin-bottom:10px}
.langs button{border:1px solid rgba(179,226,205,.6);background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;min-height:36px;cursor:pointer}
.langs button.on{background:var(--mint);color:var(--g);border-color:var(--mint);font-weight:600}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .btn{flex:1;padding:14px 6px;min-height:56px;white-space:nowrap;font-size:15px}
.btn.s{background:rgba(255,255,255,.18);color:#fff}
.btn.saved{background:#fff;color:var(--g)}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--mint);width:0}
.item.act .prog{animation:p 12s linear forwards}
.item.paused .prog{animation-play-state:paused}
@keyframes p{to{width:100%}}
@media (prefers-reduced-motion:reduce){.item.act .prog{animation:none;width:100%}}
nav.fn{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;background:rgba(10,20,16,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.15)}
nav.fn button{flex:1;border:0;background:none;color:#fff;padding:8px 0;font-size:13px;cursor:pointer;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav.fn button i{font-style:normal;display:flex;color:var(--mint)}
nav.fn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.fn button.on{font-weight:700}

/* sheets + toast */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.panel{background:var(--card);color:var(--tx);width:100%;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.panel h3{font-size:18px;margin-bottom:4px}
.panel label{display:block}
.panel label.chk{display:flex}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--tx);color:var(--bg);padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* marketing home */
.hero{padding:8px 0 4px}
.hero p.lead{font-size:16px;margin-top:10px;color:var(--tx2)}
.reels{display:flex;gap:10px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.reel{flex:none;width:132px;aspect-ratio:9/16;border-radius:18px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 60%)}
.reel>*{position:relative;z-index:1}
.reel b{font-size:13px}.reel span{font-size:11px;opacity:.9}
.reel .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;opacity:.25;z-index:0}
.sec{padding-top:28px}
.sec>h2{margin:6px 0 12px}
.steps{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--tx)}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.steps b{display:block;font-size:15px}.steps span{display:block;font-size:14px;color:var(--tx2);line-height:1.45}
.price{display:flex;flex-direction:column;gap:6px}
.price .amt{font-size:26px;font-weight:800;letter-spacing:-.5px}
.price.hi{border:2px solid var(--g)}
details{border-bottom:1px solid var(--bd);padding:14px 0}
summary{font-weight:600;cursor:pointer;font-size:15px;list-style-position:outside}
details p{margin-top:8px}
footer.ft{margin-top:28px;padding:20px 0 8px;border-top:1px solid var(--bd)}
footer.ft .wrap span{font-size:13px;color:var(--tx2);margin-right:10px}
.cta{background:var(--g);color:#fff;border-radius:24px;padding:22px 18px;margin-top:28px}
.cta h2{color:#fff}.cta p{color:#e3efe9}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--bd);scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 16px;font-size:14px;font-weight:600;min-height:42px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--bd)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--tx2)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--g)}
.num{width:90px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
</style>

<div class="app" id="app">
  <div id="view"></div>
  <div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept="video/*" capture="user" hidden>
</div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function ini(n){return n.split(" ").map(function(w){return w[0]}).join("")}
function grad(c){return "linear-gradient(160deg,"+c[0]+","+c[1]+")"}
var LN={EN:"English",AR:"Arabic",FR:"French"};
var ICON={
 discover:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 saved:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 inbox:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 account:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
 video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11l5-3v8l-5-3z"/></svg>',

function feedList(){

 });
}

/* ---------- router ---------- */
var io;
function route(){return location.hash.replace(/^#/,"")||"home"}
function render(keep){
 var r=route(),html,sc=0,fs=0;
 if(keep){var m=$("[data-scroll]");if(m)sc=m.scrollTop;var f=$("#feed");if(f)fs=f.scrollTop}
 if(r.indexOf("c-")===0)html=profilePage(r.slice(2));else html=(V[r]||V.home)();
 $("#view").innerHTML=html;
 if(keep){var m2=$("[data-scroll]");if(m2)m2.scrollTop=sc;var f2=$("#feed");if(f2)f2.scrollTop=fs}
 if(r==="feed")observe();
}
window.addEventListener("hashchange",function(){closeSheet();S.fopen=false;S.studioErr="";render()});
function go(r){if(route()===r)render();else location.hash=r}
function observe(){
 if(io)io.disconnect();var feed=$("#feed");if(!feed)return;
 io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle("act",e.isIntersecting&&e.intersectionRatio>.6)})},{root:feed,threshold:[.6]});
 feed.querySelectorAll(".item").forEach(function(el){io.observe(el)});
 feed.addEventListener("keydown",function(e){if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();feed.scrollBy({top:(e.key==="ArrowDown"?1:-1)*feed.clientHeight,behavior:"smooth"})}});
}

/* ---------- actions ---------- */
function rid(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,function(x){return x.toString(36).padStart(2,"0")}).join("").slice(0,22)}
function needEmp(why){if(S.mode!=="employer"){gateSheet(why);return true}return false}

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act],[data-go],[data-close]");
 if(!el){
  if(e.target===sheet){closeSheet();return}
  var card=e.target.closest(".fcard");
  if(card){var it=card.closest(".item");it.classList.toggle("paused")}
  return;
 }
 var a=el.getAttribute("data-act"),g=el.getAttribute("data-go"),id=el.getAttribute("data-id");
 if(el.hasAttribute("data-close")&&!a)closeSheet();
 if(g){closeSheet();go(g);return}
 if(!a)return;
 switch(a){
 case "screens":screensSheet();break;
 case "as":S.mode=el.getAttribute("data-v");closeSheet();render(true);toast(S.mode==="employer"?"Viewing as a signed-in employer":"Viewing as a visitor");break;
 case "gate":gateSheet(el.getAttribute("data-why"));break;
 case "signup-as":S.su.role=el.getAttribute("data-role");S.su.err="";closeSheet();go("signup");break;
 case "su-role":S.su.role=el.getAttribute("data-role");S.su.err="";render(true);break;
 case "demo-login":
  var role=el.getAttribute("data-role");
  if(role==="candidate")go("me-home");
  else if(role==="employer"){S.mode="employer";go("feed")}
  else openSheet('<h3>Two-step sign-in</h3><p>Enter the 6-digit code from your authenticator app.</p><form id="mfaForm" novalidate><label class="f" for="mfa">Code</label><input class="i" id="mfa" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><p class="err" id="mfaerr" hidden></p><button class="btn w" style="margin-top:12px" type="submit">Verify</button></form><p class="note" style="margin-top:8px">Demo: any 6 digits work.</p>');
  break;
 case "verified":if(S.su.role==="employer"){S.mode="employer";toast("Email verified. Welcome to Hireel.");go("feed")}else{S.ob.step=1;toast("Email verified");go("onboarding")}break;
 /* onboarding */
 case "ob-next":obNext();break;
 case "ob-back":if(S.ob.step>1){S.ob.step--;S.ob.err="";render()}else go("verify");break;
 case "ob-addskill":var inp=$("#ob-skill"),v=inp.value.trim();if(v&&S.ob.skills.length<8&&S.ob.skills.indexOf(v)<0){S.ob.skills.push(v);render(true);$("#ob-skill").focus()}break;
 case "ob-rmskill":S.ob.skills.splice(+el.getAttribute("data-i"),1);render(true);break;
 case "ob-mode":S.ob.mode=el.getAttribute("data-m");render(true);break;
 case "ob-vis":S.ob.vis=el.value;break;
 case "ob-consent":S.ob.consent=el.checked;break;
 /* candidate */
 case "slot":S.active=+el.getAttribute("data-i");S.studioErr="";render(true);break;
 case "rec":$("#file").value="";$("#file").click();break;
 case "mkp":S.primary=S.active;S.prev=S.active;toast("Primary video updated");render(true);break;
 case "setst":S.slots[S.active].status=el.getAttribute("data-st");render(true);break;
 case "textonly":S.textOnly=!S.textOnly;render(true);break;
 case "prev":S.prev=+el.getAttribute("data-i");render(true);break;
 case "edit-profile":S.ob.step=1;go("onboarding");break;
 case "share-tog":S.shareOn=!S.shareOn;if(S.shareOn)S.shareUrl="https://hireel.example/p/"+rid();render(true);break;
 case "regen":S.shareUrl="https://hireel.example/p/"+rid();toast("New link made. The old one no longer works.");render(true);break;
 case "copy":
  var u=$("#url");var done=function(){el.textContent="Copied";setTimeout(function(){el.textContent="Copy"},1500)};
  try{navigator.clipboard.writeText(u.value).then(done,function(){u.select();done()})}catch(err){u.select();done()}
  break;
 case "vis":S.vis=el.value;S.ob.vis=el.value;toast(S.vis==="all"?"Everyone can watch your reel":"Only signed-in employers can watch your reel");break;
 case "pub-tog":S.published=!S.published;toast(S.published?"Profile published":"Profile unpublished. Employers can’t see it.");render(true);break;
 case "pause-tog":S.paused=!S.paused;render(true);break;
 case "accept":acceptSheet(id);break;
 case "decline":setReq(id,"Declined");toast("Request declined. The company isn’t told why.");break;
 case "block":S.confirmBlock=id;render(true);break;
 case "block-cancel":S.confirmBlock=null;render(true);break;
 case "block-yes":S.confirmBlock=null;setReq(id,"Blocked");toast("Company blocked");break;
 case "report":case "report-prof":
  openSheet('<h3>Report</h3><p>Tell us what’s wrong. The other side isn’t told who reported.</p><div class="stack" style="gap:4px;margin-top:8px">'+["Looks like a fake company or profile","Asked for money or personal documents","Harassment or offensive message","Something else"].map(function(x,i){return '<label class="chk"><input type="radio" name="rp" value="'+i+'"'+(i===0?" checked":"")+'><span>'+x+'</span></label>'}).join("")+'</div><label class="f" for="rpx">Details (optional)</label><textarea class="i" id="rpx"></textarea><div class="row" style="margin-top:12px"><button class="btn g" data-close>Cancel</button><button class="btn" data-act="report-send">Send report</button></div>');
  break;
 case "report-send":closeSheet();toast("Report sent to the Hireel team (demo)");break;
 case "acc-yes":
  var r=S.candReq.filter(function(x){return x.id===id})[0],sh=[];
  panel.querySelectorAll("input[data-share]:checked").forEach(function(c){sh.push(c.getAttribute("data-share"))});
  r.shared=sh.length?sh:["Nothing yet"];closeSheet();setReq(id,"Accepted");toast("Accepted. "+r.co+" can now see what you shared.");break;
 /* employer feed */
 case "filters":S.fopen=!S.fopen;$("#chips").classList.toggle("show",S.fopen);el.setAttribute("aria-expanded",S.fopen);break;
 case "f-ind":S.ind=el.getAttribute("data-v");S.fopen=false;render();break;
 case "f-lang":S.lang=el.getAttribute("data-v");S.cardLang={};S.fopen=false;render();break;
 case "clang":S.cardLang[id]=el.getAttribute("data-l");render(true);break;
 case "mute":el.textContent=el.textContent.indexOf("Muted")>-1?"🔊 Sound on":"🔇 Muted";break;
 case "save":
  if(needEmp("save"))break;
  if(!S.saved[id]&&savedCount()>=S.plans[S.plan].saved){upgradeSheet("Your saved list is full on the "+S.plans[S.plan].name+" plan.");break}
  S.saved[id]=!S.saved[id];render(true);toast(S.saved[id]?"Saved":"Removed from saved");break;
 case "prof":if(needEmp("prof"))break;profileSheet(id);break;
 case "row":if(needEmp("row"))break;go("c-"+id);break;
 case "req":if(needEmp("req"))break;if(S.empReq.some(function(r){return r.cid===id}))break;reqSheet(id);break;
 case "upgrade":upgradeSheet("Get more intro requests and CV & contact requests every month.");break;
 case "demo-premium":S.plan="premium";S.companies[0].plan="premium";closeSheet();render(true);toast("You’re on Premium (demo)");break;
 case "signout":S.mode="visitor";go("feed");toast("Signed out");break;
 case "s-ind":S.sInd=el.getAttribute("data-v");render(true);break;
 /* admin */
 case "atab":S.atab=el.getAttribute("data-v");S.rejecting=null;render();break;
 case "approve":adminDecide(id,true);break;
 case "rj":S.rejecting=id;render(true);break;
 case "rj-cancel":S.rejecting=null;render(true);break;
 case "rr-pick":$("#rr").value=el.getAttribute("data-v")+". ";$("#rr").focus();break;
 case "rj-yes":var reason=$("#rr").value.trim();if(reason.length<5){var re=$("#rrerr");re.textContent="Write a reason so the candidate knows what to fix.";re.hidden=false;break}adminDecide(id,false,reason);break;
 case "co-verify":S.companies[+el.getAttribute("data-i")].st="Verified";toast("Company verified");render(true);break;
 case "co-susp":var co=S.companies[+el.getAttribute("data-i")];co.st=co.st==="Suspended"?"Not verified":"Suspended";toast(co.st==="Suspended"?"Company suspended. Their requests are hidden.":"Company reactivated");render(true);break;
 case "plans-save":
  var bad=false;document.querySelectorAll("[data-pl]").forEach(function(inp){var k=inp.getAttribute("data-pl"),f=inp.getAttribute("data-f");if(f==="name"||f==="price"){if(!inp.value.trim())bad=true;else S.plans[k][f]=inp.value.trim()}else{var n=parseInt(inp.value,10);if(isNaN(n)||n<0)bad=true;else S.plans[k][f]=n}});
  if(bad)toast("Check the fields: names can’t be empty and limits must be 0 or more");else toast("Plans saved");render(true);break;
 }
});
document.addEventListener("change",function(e){
 var el=e.target;
 if(el.matches("[data-ob]")){S.ob[el.getAttribute("data-ob")]=el.value}
 if(el.id==="lang"){
  var other=S.slots[1-S.active].lang,hasOther=!!(S.slots[1-S.active].url||S.slots[1-S.active].sample);
  if(hasOther&&el.value===other){S.studioErr="Your two videos need different languages.";render(true);return}
  S.slots[S.active].lang=el.value;if(!hasOther&&el.value===other)S.slots[1-S.active].lang=["EN","AR","FR"].filter(function(x){return x!==el.value})[0];
  S.studioErr="";render(true);
 }
 if(el.matches("[data-act=co-plan]")){var i=+el.getAttribute("data-i");S.companies[i].plan=el.value;if(i===0)S.plan=el.value;toast(S.companies[i].n+" is now on "+S.plans[el.value].name)}
});
document.addEventListener("input",function(e){
 var el=e.target;
 if(el.matches("[data-ob]"))S.ob[el.getAttribute("data-ob")]=el.value;
 if(el.id==="sq"){S.searchQ=el.value;$("#sres").innerHTML=searchResults()}
});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"&&sheet.classList.contains("show"))closeSheet();
 if(e.key==="Enter"&&e.target.id==="ob-skill"){e.preventDefault();var b=$("[data-act=ob-addskill]");if(b)b.click()}
});
document.addEventListener("submit",function(e){
 e.preventDefault();var f=e.target;
 if(f.id==="signupForm"){
  var email=$("#su-email").value.trim(),pass=$("#su-pass").value,agree=$("#su-agree").checked,err="";
  var need=S.su.role==="candidate"?[$("#su-first").value,$("#su-last").value]:[$("#su-co").value,$("#su-person").value];
  if(need.some(function(x){return !x.trim()}))err=S.su.role==="candidate"?"Add your first and last name.":"Add your company name and your name.";
  else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))err="Enter a valid email address, like name@example.com.";
  else if(pass.length<8)err="Use a password with at least 8 characters.";
  else if(!agree)err="Please agree to the Terms and Privacy Policy to continue.";
  if(err){S.su.err=err;var vals={};f.querySelectorAll("input,select").forEach(function(x){vals[x.id]=x.type==="checkbox"?x.checked:x.value});render(true);Object.keys(vals).forEach(function(k){var x=document.getElementById(k);if(x){if(x.type==="checkbox")x.checked=vals[k];else x.value=vals[k]}});return}
  S.su.err="";S.su.email=email;go("verify");
 }
 if(f.id==="loginForm"){toast("Demo: use a shortcut below to log in")}
 if(f.id==="forgotForm"){var m=$("#fg-msg");m.hidden=false;m.style.color="var(--brand)";m.textContent="If an account exists for that email, a reset link is on its way.";}
 if(f.id==="mfaForm"){if(!/^\d{6}$/.test($("#mfa").value.trim())){var me=$("#mfaerr");me.textContent="Enter the 6 digits from your app.";me.hidden=false;return}closeSheet();go("admin")}
 if(f.id==="reqForm"){
  var cid=f.getAttribute("data-id"),t=$("#f1").value.trim(),msg=$("#f3").value.trim(),cv=$("#f6").checked,fe=$("#ferr");
  if(!t||msg.length<10){fe.textContent="Add an opportunity title and a short message (10+ characters).";fe.hidden=false;return}
  if(cv&&left("cv")<=0){fe.textContent="No CV & contact requests left this month. Untick the box or upgrade.";fe.hidden=false;return}
  S.used.intro++;if(cv)S.used.cv++;
  S.empReq.unshift({cid:cid,title:t,status:"Pending",date:"Today",cv:cv?1:0});
  closeSheet();render(true);toast("Request sent to "+cand(cid).n.split(" ")[0]+" (demo)");
 }
});
function obNext(){
 var o=S.ob;o.err="";
 if(o.step===1&&(!o.name.trim()||!o.headline.trim()))o.err="Add your name and a headline.";
 if(o.step===2&&(!o.title.trim()||o.years===""||+o.years<0||+o.years>50))o.err="Add your position and years of experience (0–50).";
 if(o.step===2&&!o.err&&!o.skills.length)o.err="Add at least one skill.";
 if(o.step===3&&o.mode==="text"&&o.about.trim().length<40)o.err="Write at least 40 characters about yourself.";
 if(o.step===4&&!o.consent)o.err="Please tick the consent box to publish.";
 if(o.err){render(true);return}
 if(o.step<4){o.step++;render();var m=$("[data-scroll]");if(m)m.scrollTop=0;return}
 S.textOnly=o.mode==="text";S.vis=o.vis;S.published=true;
 C[0].t=o.headline;C[0].n=o.name;C[0].loc=o.loc;C[0].sk=o.skills.slice(0,3);C[0].av=o.avail;C[0].y=+o.years;
 toast("Profile published (demo)");go(o.mode==="video"?"me-video":"me-home");
}
function setReq(id,st){S.candReq.forEach(function(r){if(r.id===id)r.status=st});render(true)}
function acceptSheet(id){
 var r=S.candReq.filter(function(x){return x.id===id})[0];
 openSheet('<h3>Accept '+esc(r.co)+'</h3><p>Choose what to share. You can change this later.</p>'+
 ['Email','Phone','CV'].map(function(k){return '<label class="chk"><input type="checkbox" data-share="'+k+'"'+(k==="Email"||r.cv?" checked":"")+'><span>'+k+'</span></label>'}).join("")+
 '<div class="row" style="margin-top:16px"><button class="btn g" data-close>Cancel</button><button class="btn" data-act="acc-yes" data-id="'+id+'">Accept and share</button></div>');
}
function adminDecide(id,ok,reason){
 S.rejecting=null;
 if(id.indexOf("lina-")===0){var s=S.slots[+id.split("-")[1]];s.status=ok?"live":"rejected";s.reason=reason||"";if(ok)s.views=0}
 else S.queue=S.queue.filter(function(q){return q.id!==id});
 toast(ok?"Approved. The video is live.":"Rejected. The candidate sees your reason.");render(true);
}

/* real local video pick (stays on this device) */
$("#file").addEventListener("change",function(){
 var f=this.files[0];if(!f)return;
 if(f.size>250*1024*1024){S.studioErr="This video is over 250 MB. Try a shorter clip.";render(true);return}
 var u=URL.createObjectURL(f),probe=document.createElement("video");probe.preload="metadata";probe.muted=true;
 probe.onloadedmetadata=function(){
  var d=probe.duration;
  if(isFinite(d)&&d>120){S.studioErr="Videos can be up to 2 minutes. This one is "+Math.floor(d/60)+":"+String(Math.round(d%60)).padStart(2,"0")+".";URL.revokeObjectURL(u);render(true);return}
  var s=S.slots[S.active],replacing=!!(s.url||s.sample);
  s.url=u;s.sample=false;s.land=probe.videoWidth>probe.videoHeight;s.views=0;s.dur=isFinite(d)?Math.floor(d/60)+":"+String(Math.round(d%60)).padStart(2,"0"):"";
  S.studioErr=isFinite(d)&&d<30?"Tip: this video is under 30 seconds. 30–90 seconds works best.":"";
  s.status="uploading";if(!S.slots.some(function(x,i){return i!==S.active&&(x.url||x.sample)}))S.primary=S.active;
  render(true);if(replacing)toast("Old video archived privately for 30 days");
  var slot=s;
  setTimeout(function(){if(slot.status==="uploading"){slot.status="processing";if(route()==="me-video"||route()==="me-home")render(true)}},1500);
  setTimeout(function(){if(slot.status==="processing"){slot.status="review";if(route()==="me-video"||route()==="me-home"||route()==="admin")render(true)}},4000);
 };
 probe.onerror=function(){S.studioErr="We couldn’t read this file. Try an MP4 or MOV video.";render(true)};
 probe.src=u;
});

render();
})();
</script>
