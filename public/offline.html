<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hireel · Offline</title>
<style>
:root{--bg:#FAF9F6;--tx:#182722;--tx2:#69766F;--g:#195C48}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a16;--tx:#f1f5f2;--tx2:#9fb0a8;--g:#B3E2CD}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
b{display:block;font-size:24px;color:var(--g);margin-bottom:12px}
p{color:var(--tx2);line-height:1.5;margin:6px 0}
button{margin-top:18px;border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px;background:#195C48;color:#fff;min-height:54px}
</style>
</head>
<body>
<div>
<b>Hireel</b>
<p>You’re offline. Check your connection and try again.</p>
<p dir="rtl" lang="ar">أنت غير متصل بالإنترنت. تحقّق من الاتصال ثم حاول مجدداً.</p>
<button onclick="location.reload()">Try again · حاول مجدداً</button>
</div>
</body>
</html>
